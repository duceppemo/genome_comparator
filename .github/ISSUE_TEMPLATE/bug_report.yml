name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please check the [troubleshooting page](https://github.com/duceppemo/genome_comparator/wiki/Troubleshooting) first.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `genome-comparator --version`
      placeholder: genome-comparator 0.4.6
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Content of `<output>/genome_comparator.log`, ideally from a run with `-v`
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, how you installed genome_comparator (conda, pip, ...), Mash version (`mash --version`)
      placeholder: Ubuntu 24.04, conda env from environment.yml, Mash 2.3
